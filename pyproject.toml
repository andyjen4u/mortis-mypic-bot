[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mortis-mypic-bot"
version = "0.1.0"
description = "Discord bot that retrieves locally cached Its-MyPic images."
requires-python = ">=3.9"
dependencies = [
  "discord.py>=2.4,<3",
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
]

[project.scripts]
mortis-bot = "mypic_bot.bot:main"
mortis-data = "mypic_bot.cli:main"

[tool.setuptools.packages.find]
include = ["mypic_bot*"]
